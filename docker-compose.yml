x-gpu: &gpu
  devices:
    - /dev/kfd
    - /dev/dri
  group_add: ["video"]
  security_opt: ["seccomp:unconfined"]

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tracer
      POSTGRES_PASSWORD: tracer
      POSTGRES_DB: tracer
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracer"]
      interval: 3s
      retries: 20

  app:
    build:
      context: .
      args:
        TORCH_INDEX: ${TORCH_INDEX:-https://download.pytorch.org/whl/cpu}
    <<: *gpu
    environment:
      TRACER_DSN: postgresql://tracer:tracer@db:5432/tracer
      TRACER_CONFIG: /app/config.yaml
      DEVICE: ${DEVICE:-cpu}
      HSA_OVERRIDE_GFX_VERSION: "10.3.0"
    volumes:
      - .:/app
      - ./data:/app/data
      - modelcache:/root/.cache/torch
    ports: ["8000:8000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db: {condition: service_healthy}
    command: uvicorn tracer.api:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    network_mode: host
    volumes:
      - ./mediamtx/pepper.yml:/mediamtx.yml:ro
      - ./data/samples:/samples:ro
    restart: unless-stopped

  worker-cam1: &worker
    build:
      context: .
      args:
        TORCH_INDEX: ${TORCH_INDEX:-https://download.pytorch.org/whl/cpu}
    devices:
      - /dev/kfd
      - /dev/dri
    group_add: ["video"]
    security_opt: ["seccomp:unconfined"]
    environment:
      TRACER_DSN: postgresql://tracer:tracer@db:5432/tracer
      TRACER_CONFIG: /app/config.yaml
      DEVICE: ${DEVICE:-cpu}
      HSA_OVERRIDE_GFX_VERSION: "10.3.0"
    volumes:
      - .:/app
      - ./data:/app/data
      - modelcache:/root/.cache/torch
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db: {condition: service_healthy}
    command: python -m tracer.worker --camera cam1
    restart: unless-stopped

  worker-cam2:
    <<: *worker
    command: python -m tracer.worker --camera cam2

volumes:
  pgdata:
  modelcache:
